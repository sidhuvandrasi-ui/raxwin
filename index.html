*{
    margin:0;
    padding:0;
    box-sizing:border-box;

html,
body{
    width:100%;
    min-height:100%;
}

body{
    font-family:'Inter',sans-serif;
    background:#030305;
    color:#fff;
    overflow-x:hidden;
    display:flex;
    justify-content:center;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;

    background:
        radial-gradient(
            circle at 50% 18%,
            rgba(145,0,255,.24),
            transparent 35%
        ),
        radial-gradient(
            circle at 50% 75%,
            rgba(95,0,255,.13),
            transparent 42%
        );

    z-index:0;
}

body::after{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;

    background:
        linear-gradient(
            rgba(255,255,255,.014) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(255,255,255,.014) 1px,
            transparent 1px
        );

            black,
            transparent 90%

    z-index:0;
}

.container{
    width:100%;

.logo-wrap{

        0 0 90px rgba(125,0,255,.16);

}

.logo{
    width:100%;
    height:100%;

    display:block;

    object-fit:cover;

    border-radius:50%;

    background:#08080c;
}

@keyframes logoGlow{

    0%,100%{
        box-shadow:
            0 0 15px rgba(150,0,255,.75),
            0 0 45px rgba(125,0,255,.42),
            0 0 90px rgba(125,0,255,.16);

            0 0 25px rgba(190,0,255,.95),

            0 0 100px rgba(125,0,255,.22);

}

.live-dot{

@keyframes liveBlink{

<script>

/* =========================
   30 SECOND TIMER
   ========================= */

let remaining = 30;

const timerText =
    document.getElementById("timerText");

function updateTimer(){

    if(remaining > 0){

        timerText.textContent =
            remaining + " SECONDS";

        remaining--;

    }else{

        timerText.textContent =
            "0 SECONDS";

    }

}

updateTimer();

setInterval(
    updateTimer,
    1000
);

</script>
